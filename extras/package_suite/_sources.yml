sources:
  - name: shop
    schema: "{{ target.schema }}"
    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_orders
        data_tests:
          - dbt_expectations.expect_table_columns_to_match_set:
              arguments: {column_list: [order_id, customer_id, amount, ordered_at, _etl_loaded_at]}
      - name: raw_customers
        config:
          freshness: null
